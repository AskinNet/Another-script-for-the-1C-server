
# Пример конфига для локальных тестов (хост HS, база task-sql, без хранилищ)
# проверить файл можно онлайн тут: https://yamlchecker.com

# restart не включаем: останавливает службы, нужен админ
batchМode: 'lock,updateFromStorage,updateDB,unlock'
debug: true

server1c:
  server: "HS"
  port: 1541                                         # основной порт который обслуживает соеднинения с кластером 1С
  portCluster1C: 1540                                # порт на котором запущен кластер 1С
  version: 8.3.27.2214
  1cDemonName:    "1C:Enterprise 8.3 Server Agent (x86-64)" # имя службы 1С
  # пути Windows - в одинарных кавычках: в двойных oscript-yaml дважды раскрывает "\\r", "\\t", "\\n" (\\reg -> CR+eg)
  Path1cService:  'D:\1C\svr1C\reg_1541'
  lockTime: 600                                      # блокировка баз в секундах
  clusterAdmin: ""                                   #
  clusterAdminPassword: ""                           #

  bases:
    task-sql:
      user: "Администратор"
      password: ""
      allowKey: 777

serverRAS:
  1cRasDemonName: "1C:Enterprise 8.3 Remote Server"  # имя службы RAS
  serverRAS: "localhost"                             # адрес RAS
  portRAS: 1545                                      # порт RAS
  useDemonRAS: true                                  # по умолчанию используется служба RAS, если её нет, он запускается вручную, ЛОКАЛЬНО!
  mportRAS: 56532                                    # порт на котором динамически запуститься RAS
  pathToBin1c: 'C:\Program Files\1cv8'           # путь к исполняемым файлам 1с. складывается из этого пути и version
  RestartRas: false                                  # при перезапуске сервера нужно ли рестартовать RAS
